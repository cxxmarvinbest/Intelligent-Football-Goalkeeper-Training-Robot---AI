# ============================================================
# 足球AI智能训练 — 算法参数配置文件
# 部署位置: /home/ztl/code/algo_params.yaml
# 所有参数通过此文件覆盖代码默认值, 非必须字段留空或删除即可使用默认值
# ============================================================

# ----------------------------------------------------------
# YOLOv8 检测参数 (RK3588 NPU 推理)
# ----------------------------------------------------------
detection:
#  1.RKNN 模型文件路径
  model_path: "/home/ztl/code/rknn_model_zoo/examples/yolov8/model/best.rknn"
#  2.NPU 核心编号 (0 / 1 / 2)
  rknn_npu_core: 0
#  3.模型输入尺寸 (正方形, 宽=高)
  rknn_input_size: 640
#  4.检测间隔 (每 N 帧推理一次, 降低 CPU 负载)
  track_interval: 2
#  5.球门框 EMA 平滑系数 (0~1, 越小越平滑但响应越慢)
  ema_alpha: 0.25
#  6.球门部件(横梁/立柱) 置信度阈值
  goal_conf: 0.25
#  7.守门员检测置信度阈值
  gk_conf: 0.2
#  8.检测类别 ID
  cls_goalkeeper: 0                     # 守门员
  cls_crossbar: 1                       # 横梁
  cls_post_left: 2                      # 左立柱
  cls_post_right: 3                     # 右立柱
  cls_ball: 4                           # 足球

# ----------------------------------------------------------
# 摄像头与视频解码参数
# ----------------------------------------------------------
camera:
#  1.RTSP 流地址
  rtsp_url: "rtsp://admin:siboasi123@192.168.8.142:554/LiveMedia/ch1/Media1"
#  2.帧缩放宽度 (0 = 不缩放, MPP 内部缩放)
  frame_scale_width: 640
#  3.帧缩放高度
  frame_scale_height: 480
#  4.帧读取超时 (毫秒)
  frame_read_timeout_ms: 3000
#  5.启动时丢弃帧数 (清空解码器旧缓冲)
  frame_discard_count: 25
#  6.MJPEG 流 JPEG 压缩质量 (1~100)
  jpeg_quality: 75
#  7.是否限制最大图像尺寸 (0=不限 / 1=限制)
  video_image_max_size_limit: 1
#  8.最大图像边长 (超过则等比缩放)
  video_image_max_size: 960
#  9.帧缓冲最大容量 (有效范围 3~5)
  frame_buffer_max_size: 5
#  10.缓冲区溢出策略 (drop_oldest)
  frame_buffer_overflow_strategy: "drop_oldest"

# ----------------------------------------------------------
# 分区网格定义 (3行 × 6列 = 18分区)
#   col  0        1        2        3        4        5
#   row  +--------+--------+--------+--------+--------+
#   0    | 反向左 |   ← ← ← ← ← 识别区域 → → → → → | 反向右 |
#   1    | 反向发 | 识别区 | 识别区 | 识别区 | 识别区 | 反向发 |
#   2    | 球区左 |        |  ← 居中列 →  |        | 球区右 |
#        +--------+--------+--------+--------+--------+
# ----------------------------------------------------------
grid:
#  1.行数 (上 / 中 / 下)
  rows: 3
#  2.列数 (最左 ~ 最右)
  cols: 6
#  3.左侧反向发球列 (守门员偏右时击球方向)
  col_reverse_left: 0
#  4.识别区左边界列 (含)
  col_center_left: 1
#  5.识别区右边界列 (含)
  col_center_right: 4
#  6.右侧反向发球列 (守门员偏左时击球方向)
  col_reverse_right: 5

# ----------------------------------------------------------
# 安全机制参数 (三重规则, 全部不通过则不发球)
# ----------------------------------------------------------
safety:
#  1.连续安全秒数达到后才允许发球
  safe_duration_before_serve: 5.0
#  2.发球后冷却时间 (秒), 期间不检测
  serve_cooldown: 2.0
#  3.守门员距离过近阈值 (检测框高度/画面高度, 超过视为过近)
  gk_frame_height_ratio_threshold: 0.45
#  4.坐标修正辅助阈值
  gk_min_center_recog_ratio: 0.55
#  5.居中判定列 (守门员在这两列的占比判定是否回中)
  center_columns: [2, 3]
#  6.回中比率下限 (列2占两列面积比 < 此值 = 偏左)
  center_ratio_min: 0.4
#  7.回中比率上限 (列2占两列面积比 > 此值 = 偏右)
  center_ratio_max: 0.6
#  8.心跳超时 (秒), 超时自动暂停
  heartbeat_timeout_seconds: 120
#  9.自动暂停时间 (分钟), 到时间自动暂停训练
  auto_pause_minutes: 60
#  10.暂停后自动结束超时 (秒), 超时自动结束训练
  auto_end_timeout: 100
